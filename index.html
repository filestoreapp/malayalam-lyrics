<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malayalam Song Lyrics</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <header>
    <h1>🎵 Malayalam Song Lyrics</h1>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search song, movie, singer...">
    </div>
    <div class="filters">
      <select id="filterType">
        <option value="all">All Songs</option>
        <option value="film">Movie</option>
        <option value="lyricist">Lyricist</option>
        <option value="musicDirector">Music Director</option>
        <option value="singers">Singer</option>
        <option value="year">Year</option>
      </select>
      <select id="filterValue">
        <option value="">Select value...</option>
      </select>
    </div>
  </header>
  <main>
    <div id="songCount"></div>
    <div id="songList"></div>
  </main>
  <script src="assets/js/main.js"></script>
</body>
</html>
