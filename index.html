<!DOCTYPE html>
<html lang="ml">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Malayalam Song Lyrics</title>
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Header -->
  <header class="main-header">
    <div class="header-top">
      <h1 class="site-title">🎵 Malayalam Lyrics</h1>
      <button id="themeToggle" class="theme-toggle" title="Toggle theme">🌓</button>
    </div>

    <!-- Search -->
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search song, movie, singer, lyricist...">
      <button id="randomSongBtn" class="random-btn" title="Random song">🎲</button>
    </div>

    <!-- Controls: sort, filter type, filter value -->
    <div class="controls">
      <select id="sortType" class="control-select">
        <option value="title">Sort by Title (A–Z)</option>
        <option value="titleDesc">Title (Z–A)</option>
        <option value="year">Year (Newest)</option>
        <option value="yearOldest">Year (Oldest)</option>
        <option value="movie">Movie (A–Z)</option>
        <option value="added">Recently Added (ID order)</option>
      </select>

      <select id="filterType" class="control-select">
        <option value="all">All Songs</option>
        <option value="film">Movie</option>
        <option value="lyricist">Lyricist</option>
        <option value="musicDirector">Music Director</option>
        <option value="singers">Singer</option>
        <option value="year">Year</option>
      </select>

      <select id="filterValue" class="control-select">
        <option value="">Select value...</option>
      </select>
    </div>

    <!-- Stats bar -->
    <div class="stats-bar" id="statsBar">
      <!-- filled by JS -->
    </div>

    <!-- Lyrics of the Day -->
    <div class="featured-song" id="featuredSong">
      <!-- filled by JS -->
    </div>
  </header>

  <!-- Main content -->
  <main class="main-content">
    <!-- Alphabet browse -->
    <div class="alphabet-browse" id="alphabetBrowse">
      <!-- A-Z buttons generated by JS -->
    </div>

    <!-- Song count -->
    <div id="songCount" class="song-count"></div>

    <!-- Song grid -->
    <div id="songList" class="song-grid"></div>

    <!-- Pagination -->
    <div class="pagination" id="pagination">
      <!-- page buttons generated by JS -->
    </div>
  </main>

  <script src="assets/js/main.js"></script>
</body>
</html>
