name: Scrape Lyrics (Year by Year)

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated years to scrape (e.g., 2026,2025). Leave blank for all years.'
        required: false
        default: ''
      clean_data:
        description: 'Delete all previously scraped data before starting? (true/false)'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Delete old data (if requested)
        if: ${{ github.event.inputs.clean_data == 'true' }}
        run: |
          rm -rf data/lyrics
          rm -f data/index.json
          rm -f scrape_log.txt

      - name: Get year list
        id: years
        run: |
          node tools/get_years.mjs > years.txt
          cat years.txt
          echo "years=$(cat years.txt)" >> $GITHUB_OUTPUT

      - name: Run scraper for each year and commit
        env:
          YEARS_INPUT: ${{ github.event.inputs.years }}
        run: |
          if [ -n "$YEARS_INPUT" ]; then
            YEARS=$(echo "$YEARS_INPUT" | tr ',' ' ')
          else
            YEARS=$(cat years.txt)
          fi

          for YEAR in $YEARS; do
            echo "Processing year: $YEAR"
            
            # Run scraper; if it fails, continue to next year to avoid total job failure
            node tools/master_scrape.mjs "$YEAR" || echo "Scraper failed for year $YEAR, but continuing..."
            
            echo "Committing after year $YEAR"
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            
            # Stage all changes (including deletions, new year folders)
            git add -A data/ scrape_log.txt 2>/dev/null || true
            
            # Commit only if there are changes
            if ! git diff --cached --quiet; then
              git commit -m "Scrape year $YEAR" || echo "Commit failed, but continuing..."
              git push || echo "Push failed, but continuing..."
            else
              echo "No changes to commit for year $YEAR"
            fi
            
            # Optional delay between years
            sleep 5
          done
