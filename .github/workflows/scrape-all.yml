name: Scrape Lyrics

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated years to scrape (e.g., 2026,2025). Leave blank for all years.'
        required: false
        default: ''
      clean_data:
        description: 'Delete all previously scraped data before starting? (true/false)'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Delete old data (if requested)
        if: ${{ github.event.inputs.clean_data == 'true' }}
        run: |
          rm -rf data/lyrics
          rm -f data/index.json
          rm -f scrape_log.txt

      - name: Run scraper
        run: |
          if [ -z "${{ github.event.inputs.years }}" ]; then
            node tools/master_scrape.mjs
          else
            YEARS=$(echo "${{ github.event.inputs.years }}" | tr ',' ' ')
            node tools/master_scrape.mjs $YEARS
          fi

      - name: Commit data and log
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/ scrape_log.txt
          git diff --cached --quiet || git commit -m "Update scraped lyrics data"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
