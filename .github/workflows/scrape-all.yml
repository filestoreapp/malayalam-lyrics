name: Scrape All Years

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        year: [2026,2025,2024,2023,2022,2021,2020,2019,2018,2017,2015,2014,2013,2012,2011,2010,2009,2008,2007,2006,2005,2004,2003,2002,2001,2000,1999,1998,1997,1996,1995,1994,1993,1992,1991,1990,1989,1988,1987,1986,1985,1984,1983,1982,1981,1980,1979,1978,1977,1976,1975,1974,1973,1972,1971,1970,1969,1968,1967,1966,1965,1964,1963,1962,1961,1960,1959,1958,1957,1956,1955,1954,1953,1952,1951,1950,1949,1948,1941,1940,1938]
      max-parallel: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install cheerio
      - run: node tools/scrape_year.mjs ${{ matrix.year }}

      # Upload the lyrics folder as an artifact (no push here)
      - name: Upload lyrics artifact
        uses: actions/upload-artifact@v4
        with:
          name: lyrics-${{ matrix.year }}
          path: data/lyrics
          retention-days: 1

  merge-and-push:
    needs: scrape
    runs-on: ubuntu-latest
    if: always()
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Create data/lyrics directory if not exists
        run: mkdir -p data/lyrics

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Copy scraped lyrics into repository
        run: |
          if [ -d "artifacts" ]; then
            cp -rf artifacts/* data/lyrics/
            # Remove any nested directories that might exist from artifacts
            find data/lyrics -type f -name "*.json" -exec cp {} data/lyrics/ \; 2>/dev/null || true
          fi

      - name: List number of lyric files
        run: echo "Total lyrics files: $(find data/lyrics -name '*.json' | wc -l)"

      - name: Build index.json
        run: node tools/build-index.mjs

      - name: Commit and push all changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/lyrics data/index.json
          git commit -m "Add scraped lyrics and update index" || echo "No changes to commit"
          git push
