name: Scrape Lyrics (Year by Year)

on:
  workflow_dispatch:
    inputs:
      years:
        description: 'Comma-separated years to scrape (e.g., 2026,2025). Leave blank for all years.'
        required: false
        default: ''
      clean_data:
        description: 'Delete all previously scraped data before starting? (true/false)'
        required: false
        default: 'false'

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install

      - name: Delete old data (if requested)
        if: ${{ github.event.inputs.clean_data == 'true' }}
        run: |
          rm -rf data/lyrics
          rm -f data/index.json
          rm -f scrape_log.txt

      - name: Get year list
        id: years
        run: |
          node tools/get_years.mjs > years.txt
          cat years.txt
          echo "years=$(cat years.txt)" >> $GITHUB_OUTPUT

      - name: Run scraper for each year and commit
        env:
          YEARS_INPUT: ${{ github.event.inputs.years }}
        run: |
          if [ -n "$YEARS_INPUT" ]; then
            YEARS=$(echo "$YEARS_INPUT" | tr ',' ' ')
          else
            YEARS=$(cat years.txt)
          fi

          for YEAR in $YEARS; do
            echo "Processing year: $YEAR"
            node tools/master_scrape.mjs "$YEAR"
            echo "Committing after year $YEAR"
            git config --global user.name 'github-actions[bot]'
            git config --global user.email 'github-actions[bot]@users.noreply.github.com'
            git add data/ scrape_log.txt
            git diff --cached --quiet || git commit -m "Scrape year $YEAR"
            git push
            sleep 5
          done
